name = "dex-swap-gateway"
main = "src/index.ts"
compatibility_date = "2025-07-18"

routes = [
  { pattern = "dex-swap.bithub.pro/api/v1/*", zone_id = "a2377099496ecf3fe85caa580e64b070" }
]

# Environment variables (set via wrangler secret or dashboard)
[vars]
# OKX DEX API endpoint
OKX_BASE_URL = "https://www.okx.com"
# Cache TTL in seconds for token list responses
TOKEN_CACHE_TTL = 60

# Secrets (set via `npx wrangler secret put` — not stored in this file):
#   OKX_API_KEY
#   OKX_SECRET_KEY
#   OKX_API_PASSPHRASE
#   OKX_PROJECT_ID
